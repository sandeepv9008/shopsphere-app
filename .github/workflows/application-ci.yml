---
name: ShopSphere Application CI

"on":
  push:
    branches:
      - 'feature/**'
      - 'release'
      - 'release/**'
      - 'main'

  pull_request:
    branches:
      - 'release'
      - 'release/**'
      - 'main'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout application source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: mvn -B clean verify

      - name: Upload build outputs for SonarQube
        uses: actions/upload-artifact@v5
        with:
          name: shopsphere-build-outputs
          path: |
            target/classes/
            target/test-classes/
            target/site/jacoco/
            target/surefire-reports/

  gitleaks:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST - SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - unit-tests
      - gitleaks

    steps:
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build outputs
        uses: actions/download-artifact@v5
        with:
          name: shopsphere-build-outputs
          path: target/

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache SonarScanner plugins
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            sonar-${{ runner.os }}-

      - name: Run SonarQube analysis
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B \
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
          -Dsonar.projectKey=ShopSphere \
          -Dsonar.host.url="$SONAR_HOST_URL" \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  sca:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout application source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache Dependency-Check database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-v12.2.2-${{ runner.os }}\
            -${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-v12.2.2-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:12.2.2:check \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
            -DnvdMaxRetryCount=20

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore

      - name: Generate CycloneDX SBOM
        if: success()
        run: |
          mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: Upload CycloneDX SBOM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shopsphere-application-sbom
          path: target/bom.json
          if-no-files-found: ignore

  trigger-platform-release:
    name: Trigger Platform Release
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - gitleaks
      - sast
      - sca
    if: >-
      success() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/release' ||
       startsWith(github.ref, 'refs/heads/release/'))
    permissions:
      contents: read

    steps:
      - name: Trigger platform release workflow
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
          APP_COMMIT_SHA: ${{ github.sha }}
        run: |
          gh api \
            --method POST \
            /repos/sandeepv9008/shopsphere-platform/dispatches \
            -f event_type=application-ci-success \
            -F "client_payload[app_commit_sha]=$APP_COMMIT_SHA"
